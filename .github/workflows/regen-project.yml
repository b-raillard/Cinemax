name: Regenerate Xcode project

# Maintenance utility, manual-trigger only: regenerates project.pbxproj with the
# same xcodegen CI uses, then COMMITS it back to the branch it ran on. Needed
# whenever files were added from an environment that can't run
# `xcodegen generate` locally (a Linux remote session) — without it the
# committed project goes stale and ci.yml's "Verify committed project.pbxproj"
# step fails the PR.
#
# It used to only echo the bytes as gzip+base64 for a human (or an agent) to
# decode and commit by hand. That still works and is kept as a fallback, but
# round-tripping ~40 KB of base64 through a job log is a poor default, so the
# workflow now does the commit itself.
on:
  # Manual only. The push trigger that bootstrapped it (a one-off maintenance
  # branch, needed before the workflow existed on main) is dead and removed.
  workflow_dispatch:

jobs:
  regen:
    name: Generate & commit pbxproj
    runs-on: macos-26
    timeout-minutes: 10
    # Required for the commit step below; the default token is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to the SAME version as ci.yml (this workflow's whole point is
      # producing the canonical bytes the CI verify step expects) — see the
      # comment in ci.yml for why `brew install` is a per-runner coin flip.
      - name: Install xcodegen
        env:
          XCODEGEN_VERSION: 2.46.0
          # SHA-256 of that release's xcodegen.zip — bump TOGETHER with the
          # version. The binary is executed right after, and in
          # regen-project.yml its output is committed with write access, so a
          # replaced release asset must fail here rather than run.
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      # Never push to the default branch from here: a regen there should go
      # through a normal PR like any other change.
      - name: Commit regenerated pbxproj
        if: github.ref_name != github.event.repository.default_branch
        run: |
          set -euo pipefail
          if git diff --quiet -- Cinemax.xcodeproj/project.pbxproj; then
            echo "project.pbxproj already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cinemax.xcodeproj/project.pbxproj
          git commit -m "chore: regenerate project.pbxproj

          Produced by the regen-project workflow with the pinned xcodegen
          (same version ci.yml verifies against), because the branch was
          authored in an environment without xcodegen."
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Fallback for the case above being skipped (a run against the default
      # branch) or the push being rejected: the canonical bytes are still
      # recoverable straight from the log.
      - name: Export regenerated pbxproj (gzip+base64)
        if: always()
        run: |
          echo "PBXPROJ_B64_BEGIN"
          gzip -9 -c Cinemax.xcodeproj/project.pbxproj | base64
          echo "PBXPROJ_B64_END"
