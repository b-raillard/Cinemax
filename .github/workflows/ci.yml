name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing here writes to the repository (the SBOM goes out as
# an artifact, which does not use GITHUB_TOKEN permissions).
permissions:
  contents: read

concurrency:
  # Main gets a group PER COMMIT; a branch keeps one group per ref.
  #
  # TWO separate GitHub behaviours were destroying main's own verification, and
  # `cancel-in-progress` alone only addresses the first:
  #   1. it cancels the RUNNING run when a newer one joins the group, and main's
  #      group key used to be a constant (`refs/heads/main`) — so merge N+1
  #      killed merge N's CI and that commit stayed on main with no result.
  #   2. GitHub keeps at most ONE pending run per group (`queue: single`, the
  #      default) and documents that "any existing pending job or workflow in
  #      the same concurrency group will be canceled and the new queued job or
  #      workflow will take its place" — so merely queueing instead of
  #      cancelling would STILL lose every intermediate commit of a burst of 3+.
  # A per-SHA group settles both: each main run is alone in its group, nothing
  # cancels it and nothing queues behind it, and a burst verifies in parallel
  # rather than serially.
  #
  # Measured 2026-09-12 on a burst of four merges: `59da476` and `41fce51` ended
  # `completed/cancelled` and `eb4723b` cancelled `d49a55f`. That is how
  # `ea96635` came to sit on main carrying a genuinely stale `project.pbxproj`
  # (three test files missing from the test target) and became the base of four
  # Dependabot PRs, all four red on a fault none of them had introduced; eight
  # older cancelled main runs say it had been happening for a while.
  #
  # PR behaviour is deliberately UNCHANGED: pushing to a branch still cancels
  # that branch's previous run, which is what keeps the runner pool free.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Toolchain pins shared by the three Xcode legs (scripts/ci-xcode-setup.sh).
env:
  # Xcode: behaviour changes between Xcode releases are documented in CLAUDE.md
  # (a `sending`-closure error on 26.5 that 26.2 accepted), so the runner
  # image's default must not decide which compiler checks a PR. Bump together
  # with `xcodeVersion` in project.yml and every `runs-on: xcode-27` below. A
  # missing version FAILS the leg: building with whatever the image defaults
  # to would silently check the PR with another compiler.
  XCODE_VERSION: "27.0"
  # xcodegen: pinned via the official release artifact, NOT `brew install`: the
  # macOS runner pool carries heterogeneous brew caches (2.45.4 and 2.46.0
  # observed pouring on different runners the same day), and xcodegen's
  # output format changes between versions — a floating install turns the
  # pbxproj verify step into a per-runner coin flip. Bump XCODEGEN_VERSION
  # together with a local `xcodegen generate` (same version) + committed
  # pbxproj, and keep regen-project.yml in sync. scripts/git-hooks/pre-commit
  # reads the FIRST `XCODEGEN_VERSION:` line of this file — keep it here.
  XCODEGEN_VERSION: 2.46.0
  # SHA-256 of that release's xcodegen.zip — bump TOGETHER with the version.
  # The binary is executed right after, and in regen-project.yml its output is
  # committed with write access, so a replaced release asset must fail here
  # rather than run.
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

# `Build & Test` used to be ONE serial job on one macOS runner (iOS tests,
# tvOS tests, Release builds: 35–37 min measured 2026-11-13). It is now three
# parallel legs behind a cheap Linux `changes` job, and the job NAMED
# `Build & Test` — the required check of branch protection — only aggregates
# their results. Each leg has its own runner, hence its own DerivedData: the
# "database is locked" race on build.db only concerns two xcodebuilds on ONE
# machine, which still never happens (each leg runs its builds serially).
jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A PR that only touches Markdown / docs cannot change what the Xcode
      # legs build, and used to cost ~17 min of macOS runner — every CLAUDE.md
      # edit included. Deliberately NOT a workflow-level `paths-ignore`: that
      # leaves a required check pending for ever. The legs below are skipped
      # on this output instead, and `Build & Test` still runs and reports.
      # Pushes to main always build.
      - name: Detect code changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # --no-renames: a rename prints only its NEW path, so a Swift file
          # moved into docs/ would read as docs-only while it left the build.
          changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          echo "$changed"
          # Documentation = anything under docs/, a Markdown file at the repo
          # root, or a CLAUDE.md anywhere (project.yml keeps those out of the
          # bundles). Any OTHER .md under a target's source path is swept into
          # the build by xcodegen, so it counts as code. `|| true`, not a
          # `grep -q` pipe: under pipefail an early-exiting `grep -q` can kill
          # its writer with SIGPIPE and turn a code change into "docs-only".
          non_doc=$(printf '%s\n' "$changed" | grep -Ev '^(docs/.*|[^/]+\.md|(.*/)?CLAUDE\.md)$' || true)
          if [ -n "$non_doc" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation-only change — build and tests skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ios-tests:
    name: iOS tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # `xcode-27` = GitHub's macOS 27 image carrying Xcode 27.x (27.0 is its
    # default and the local toolchain). Still labelled "preview" by GitHub —
    # queueing can be slower than on macos-26.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode, install xcodegen, generate the project
        run: scripts/ci-xcode-setup.sh

      # Once is enough: every leg generates the same project from the same
      # project.yml with the same pinned xcodegen.
      # CI builds from the freshly generated project, so a stale committed
      # pbxproj (files added without re-running `xcodegen generate`) would pass
      # CI while breaking every local build that opens the committed project
      # ("Cannot find 'X' in scope" for types that exist). Fail loudly instead
      # so the regenerated file has to ship with the PR.
      - name: Verify committed project.pbxproj is up to date
        run: |
          if ! git diff --exit-code -- Cinemax.xcodeproj/project.pbxproj; then
            echo "::error::Cinemax.xcodeproj/project.pbxproj is stale — run 'xcodegen generate' locally and commit the regenerated project."
            exit 1
          fi

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: spm-${{ runner.os }}-${{ hashFiles('Cinemax.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/CinemaxKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Both test legs tee the raw log and then require swift-testing's own
      # summary line with a non-zero count, plus one suite that exists only on
      # that platform. xcodebuild can report success after running ZERO
      # swift-testing tests (the `-only-testing` trap in CLAUDE.md), so the exit
      # code alone does not prove the suite ran.
      # The xcode-27 image carries no "iPhone 17 Pro" simulator (iPhone 17,
      # 17e, 18 Pro, Air…); any iPhone runs the same suite.
      - name: Build & test (iOS)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinemax.xcodeproj \
            -scheme Cinemax \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/ios-test.log" | xcbeautify
          # « ━ » = passed WITH known issues: the real-StoreKit tests, inactive on
          # a fresh simulator (`localStoreKitColdStartTolerant`). Only that cause
          # is tolerated — measured before each body — so a real failure there
          # still fails the run.
          grep -E '^(✔|━) Test run with [1-9][0-9]* tests in [0-9]+ suites passed' "$RUNNER_TEMP/ios-test.log"
          grep -F '✔ Suite "Identify applies the chosen artwork" passed' "$RUNNER_TEMP/ios-test.log"

  tvos-tests:
    name: tvOS tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode, install xcodegen, generate the project
        run: scripts/ci-xcode-setup.sh

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: spm-${{ runner.os }}-${{ hashFiles('Cinemax.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/CinemaxKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The CinemaxTV scheme carries CinemaxTVTests — the same
      # Tests/CinemaxKitTests sources, hosted by CinemaxTV.app. Same two
      # assertions as the iOS leg (see the comment there).
      - name: Build & test (tvOS)
        run: |
          set -o pipefail
          # The image's Apple TV simulators change under us (2026-11-06: no
          # « Apple TV 4K (3rd generation) » any more) — pick one, or create it.
          TV_SIMULATOR=$(scripts/ci-tvos-simulator.sh)
          echo "tvOS destination: $TV_SIMULATOR"
          xcodebuild test \
            -project Cinemax.xcodeproj \
            -scheme CinemaxTV \
            -destination "id=$TV_SIMULATOR" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/tvos-test.log" | xcbeautify
          grep -E '^(✔|━) Test run with [1-9][0-9]* tests in [0-9]+ suites passed' "$RUNNER_TEMP/tvos-test.log"
          grep -F '✔ Suite "tvOS layout metrics" passed' "$RUNNER_TEMP/tvos-test.log"

  release-builds:
    name: Release builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode, install xcodegen, generate the project
        run: scripts/ci-xcode-setup.sh

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: spm-${{ runner.os }}-${{ hashFiles('Cinemax.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/CinemaxKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # The tests run the Debug configuration only, so `#if DEBUG` branches and
      # the optimiser were first seen at archive time. A plain Release compile
      # of both apps (simulator SDK, unsigned, arm64 only — one slice is enough
      # to see a Release-only compile error, and keeps the leg inside its
      # timeout) closes that gap; no tests, no run.
      - name: Build Release (iOS + tvOS)
        run: |
          set -o pipefail
          for scheme in Cinemax CinemaxTV; do
            if [ "$scheme" = Cinemax ]; then dest='generic/platform=iOS Simulator'; else dest='generic/platform=tvOS Simulator'; fi
            xcodebuild build \
              -project Cinemax.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination "$dest" \
              -skipPackagePluginValidation \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              2>&1 | xcbeautify
          done

      # A PRO_PREVIEW build (the TestFlight preview of the purchase) is only
      # ever compiled at archive time, so its `#if … PRO_PREVIEW` branches were
      # first seen there. One platform is enough to catch a compile error. The
      # step also proves the build carries its Info.plist mark and that
      # scripts/check-archive-sdk.sh refuses it — a preview build answers
      # « Pro launched » with no founders, and is never submitted for review.
      # Kept in THIS leg, after the iOS Release build: it rebuilds on that
      # DerivedData (3.3 min measured 2026-11-13), and its `find` of
      # Cinemax.app reads this runner's products.
      - name: Build Release with PRO_PREVIEW (iOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cinemax.xcodeproj \
            -scheme Cinemax \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) PRO_PREVIEW' \
            2>&1 | xcbeautify
          app=$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Build/Products/Release-iphonesimulator/Cinemax.app' -prune | head -n 1)
          /usr/libexec/PlistBuddy -c 'Print :JGCompilationConditions' "$app/Info.plist" | grep -qw PRO_PREVIEW
          archive="$RUNNER_TEMP/preview.xcarchive"
          mkdir -p "$archive/Products/Applications"
          cp -R "$app" "$archive/Products/Applications/"
          if scripts/check-archive-sdk.sh "$archive" 2> "$RUNNER_TEMP/archive-check.err"; then
            echo "::error::scripts/check-archive-sdk.sh accepted a PRO_PREVIEW build"
            exit 1
          fi
          grep -F 'a PRO_PREVIEW build is never submitted for review' "$RUNNER_TEMP/archive-check.err"

  # The required check (branch protection names `Build & Test`, `SwiftLint`,
  # `Dependency audit`): keep this job's NAME as it is, and never let a second
  # job or a matrix carry it. It builds nothing; it fails unless the legs
  # match what `changes` decided — ALL `success` for a code change, ALL
  # `skipped` for a docs-only PR. Accepting "success or skipped" per leg would
  # go green with nothing built the day the `outputs:` mapping broke.
  # `always()`, not `!cancelled()`: without it a failed `changes` job would
  # make this one SKIPPED, and branch protection reads a skipped required
  # check as passing — and a cancelled run must report red, not skipped.
  build:
    name: Build & Test
    needs: [changes, ios-tests, tvos-tests, release-builds]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check every leg
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          IOS: ${{ needs.ios-tests.result }}
          TVOS: ${{ needs.tvos-tests.result }}
          RELEASE: ${{ needs.release-builds.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=$CODE ios-tests=$IOS tvos-tests=$TVOS release-builds=$RELEASE"
          if [ "$CHANGES" != success ]; then
            echo "::error::Detect code changes ended '$CHANGES'"; exit 1
          fi
          case "$CODE" in
            true) want=success ;;
            false) want=skipped ;;
            *) echo "::error::Detect code changes gave code='$CODE'"; exit 1 ;;
          esac
          failed=0
          for leg in "ios-tests=$IOS" "tvos-tests=$TVOS" "release-builds=$RELEASE"; do
            if [ "${leg#*=}" != "$want" ]; then
              echo "::error::${leg%%=*} ended '${leg#*=}', expected '$want' (code=$CODE)"
              failed=1
            fi
          done
          [ "$failed" = 0 ]

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned like xcodegen: a new SwiftLint release can add or tighten a rule
      # and turn every PR red overnight. Bump SWIFTLINT_VERSION + checksum
      # together, and regenerate the baseline with that version if it moves.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.63.2
          SWIFTLINT_SHA256: c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-dist
          echo "/tmp/swiftlint-dist" >> "$GITHUB_PATH"

      # Blocking: every violation that predates the job going strict is in the
      # baseline (paths relative to the repo root); anything NEW fails the PR.
      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict --quiet --baseline .swiftlint-baseline.json

      # A baseline entry nothing matches any more can absorb an identical NEW
      # violation (entries match on file + rule + line text): fail on any.
      # `--write-baseline` exits non-zero whenever violations exist (they
      # always do — they are the baseline); a missing file still fails below.
      - name: Check the SwiftLint baseline has no stale entry
        run: |
          swiftlint lint --quiet --write-baseline "$RUNNER_TEMP/fresh-baseline.json" > /dev/null || true
          python3 scripts/check-swiftlint-baseline.py .swiftlint-baseline.json "$RUNNER_TEMP/fresh-baseline.json"

  # Dependency drift + SBOM (#187). Plain Python 3 on Linux: no Xcode, no
  # toolchain install. `check` fails when Package.resolved, the recorded list
  # in docs/dependencies/checksums.md, CinemaxKit's own Package.resolved, the
  # versions hard-coded in LicensesView, or a binary artifact's declared
  # checksum drift apart — see that doc for what SwiftPM already verifies.
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check pins, licences and binary artifacts
        run: python3 scripts/dependency-audit.py check

      # FR/EN/DE key parity, `.one` plurals, and matching format specifiers —
      # was only a local skill (`localize-check`), never enforced.
      - name: Check localization parity
        run: python3 scripts/check-localization-parity.py

      # Generated on every run so a broken generator shows up in the PR that
      # breaks it; uploaded only for main.
      - name: Generate CycloneDX SBOM
        run: python3 scripts/dependency-audit.py sbom --output cinemax-sbom.cdx.json

      - name: Upload SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cinemax-sbom
          path: cinemax-sbom.cdx.json
