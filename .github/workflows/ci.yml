name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing here writes to the repository (the SBOM goes out as
# an artifact, which does not use GITHUB_TOKEN permissions).
permissions:
  contents: read

concurrency:
  # Main gets a group PER COMMIT; a branch keeps one group per ref.
  #
  # TWO separate GitHub behaviours were destroying main's own verification, and
  # `cancel-in-progress` alone only addresses the first:
  #   1. it cancels the RUNNING run when a newer one joins the group, and main's
  #      group key used to be a constant (`refs/heads/main`) — so merge N+1
  #      killed merge N's CI and that commit stayed on main with no result.
  #   2. GitHub keeps at most ONE pending run per group (`queue: single`, the
  #      default) and documents that "any existing pending job or workflow in
  #      the same concurrency group will be canceled and the new queued job or
  #      workflow will take its place" — so merely queueing instead of
  #      cancelling would STILL lose every intermediate commit of a burst of 3+.
  # A per-SHA group settles both: each main run is alone in its group, nothing
  # cancels it and nothing queues behind it, and a burst verifies in parallel
  # rather than serially.
  #
  # Measured 2026-09-12 on a burst of four merges: `59da476` and `41fce51` ended
  # `completed/cancelled` and `eb4723b` cancelled `d49a55f`. That is how
  # `ea96635` came to sit on main carrying a genuinely stale `project.pbxproj`
  # (three test files missing from the test target) and became the base of four
  # Dependabot PRs, all four red on a fault none of them had introduced; eight
  # older cancelled main runs say it had been happening for a while.
  #
  # PR behaviour is deliberately UNCHANGED: pushing to a branch still cancels
  # that branch's previous run, which is what keeps the runner pool free.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    # Two test bundles now (iOS + tvOS), built and run serially.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A PR that only touches Markdown / docs cannot change what this job
      # builds, and used to cost ~17 min of macOS runner — every CLAUDE.md edit
      # included. Deliberately NOT a workflow-level `paths-ignore`: that leaves a
      # required check pending for ever. The job still runs and reports; every
      # step below is gated on this output instead. Pushes to main always build.
      - name: Detect code changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # --no-renames: a rename prints only its NEW path, so a Swift file
          # moved into docs/ would read as docs-only while it left the build.
          changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          echo "$changed"
          # Documentation = anything under docs/, a Markdown file at the repo
          # root, or a CLAUDE.md anywhere (project.yml keeps those out of the
          # bundles). Any OTHER .md under a target's source path is swept into
          # the build by xcodegen, so it counts as code. `|| true`, not a
          # `grep -q` pipe: under pipefail an early-exiting `grep -q` can kill
          # its writer with SIGPIPE and turn a code change into "docs-only".
          non_doc=$(printf '%s\n' "$changed" | grep -Ev '^(docs/.*|[^/]+\.md|(.*/)?CLAUDE\.md)$' || true)
          if [ -n "$non_doc" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation-only change — build and tests skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned: behaviour changes between Xcode releases are documented in
      # CLAUDE.md (a `sending`-closure error on 26.5 that 26.2 accepted), so the
      # runner image's default must not decide which compiler checks a PR. Bump
      # together with `xcodeVersion` in project.yml.
      - name: Select Xcode
        if: steps.changes.outputs.code == 'true'
        env:
          XCODE_VERSION: "26.5"
        run: |
          available=$(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
            echo "::notice::Xcode ${XCODE_VERSION} selected (available: ${available})"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not on this runner image — building with the default. Available: ${available}"
          fi
          xcode-select -p
          xcodebuild -version

      # Pinned via the official release artifact, NOT `brew install`: the
      # macOS runner pool carries heterogeneous brew caches (2.45.4 and 2.46.0
      # observed pouring on different runners the same day), and xcodegen's
      # output format changes between versions — a floating install turns the
      # pbxproj verify step below into a per-runner coin flip. Bump
      # XCODEGEN_VERSION together with a local `xcodegen generate` (same
      # version) + committed pbxproj, and keep regen-project.yml in sync.
      - name: Install xcodegen
        if: steps.changes.outputs.code == 'true'
        env:
          XCODEGEN_VERSION: 2.46.0
          # SHA-256 of that release's xcodegen.zip — bump TOGETHER with the
          # version. The binary is executed right after, and in
          # regen-project.yml its output is committed with write access, so a
          # replaced release asset must fail here rather than run.
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        if: steps.changes.outputs.code == 'true'
        run: xcodegen generate

      # CI builds from the freshly generated project, so a stale committed
      # pbxproj (files added without re-running `xcodegen generate`) would pass
      # CI while breaking every local build that opens the committed project
      # ("Cannot find 'X' in scope" for types that exist). Fail loudly instead
      # so the regenerated file has to ship with the PR.
      - name: Verify committed project.pbxproj is up to date
        if: steps.changes.outputs.code == 'true'
        run: |
          if ! git diff --exit-code -- Cinemax.xcodeproj/project.pbxproj; then
            echo "::error::Cinemax.xcodeproj/project.pbxproj is stale — run 'xcodegen generate' locally and commit the regenerated project."
            exit 1
          fi

      - name: Cache SwiftPM
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: spm-${{ runner.os }}-${{ hashFiles('Cinemax.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/CinemaxKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Both test steps tee the raw log and then require swift-testing's own
      # summary line with a non-zero count, plus one suite that exists only on
      # that platform. xcodebuild can report success after running ZERO
      # swift-testing tests (the `-only-testing` trap in CLAUDE.md), so the exit
      # code alone does not prove the suite ran.
      - name: Build & test (iOS)
        if: steps.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinemax.xcodeproj \
            -scheme Cinemax \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/ios-test.log" | xcbeautify
          grep -E '^✔ Test run with [1-9][0-9]* tests in [0-9]+ suites passed' "$RUNNER_TEMP/ios-test.log"
          grep -F '✔ Suite "Identify applies the chosen artwork" passed' "$RUNNER_TEMP/ios-test.log"

      # Serial with the iOS step on purpose: both write the same DerivedData,
      # and two concurrent xcodebuilds race on its build.db ("database is
      # locked"). The CinemaxTV scheme carries CinemaxTVTests — the same
      # Tests/CinemaxKitTests sources, hosted by CinemaxTV.app.
      - name: Build & test (tvOS)
        if: steps.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cinemax.xcodeproj \
            -scheme CinemaxTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/tvos-test.log" | xcbeautify
          grep -E '^✔ Test run with [1-9][0-9]* tests in [0-9]+ suites passed' "$RUNNER_TEMP/tvos-test.log"
          grep -F '✔ Suite "tvOS layout metrics" passed' "$RUNNER_TEMP/tvos-test.log"

      # The tests run the Debug configuration only, so `#if DEBUG` branches and
      # the optimiser were first seen at archive time. A plain Release compile
      # of both apps (simulator SDK, unsigned, arm64 only — one slice is enough
      # to see a Release-only compile error, and keeps the job inside its
      # timeout) closes that gap; no tests, no run.
      - name: Build Release (iOS + tvOS)
        if: steps.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          for scheme in Cinemax CinemaxTV; do
            if [ "$scheme" = Cinemax ]; then dest='generic/platform=iOS Simulator'; else dest='generic/platform=tvOS Simulator'; fi
            xcodebuild build \
              -project Cinemax.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination "$dest" \
              -skipPackagePluginValidation \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              2>&1 | xcbeautify
          done

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned like xcodegen: a new SwiftLint release can add or tighten a rule
      # and turn every PR red overnight. Bump SWIFTLINT_VERSION + checksum
      # together, and regenerate the baseline with that version if it moves.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.63.2
          SWIFTLINT_SHA256: c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-dist
          echo "/tmp/swiftlint-dist" >> "$GITHUB_PATH"

      # Blocking: every violation that predates the job going strict is in the
      # baseline (paths relative to the repo root); anything NEW fails the PR.
      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict --quiet --baseline .swiftlint-baseline.json

  # Dependency drift + SBOM (#187). Plain Python 3 on Linux: no Xcode, no
  # toolchain install. `check` fails when Package.resolved, the recorded list
  # in docs/dependencies/checksums.md, CinemaxKit's own Package.resolved, the
  # versions hard-coded in LicensesView, or a binary artifact's declared
  # checksum drift apart — see that doc for what SwiftPM already verifies.
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check pins, licences and binary artifacts
        run: python3 scripts/dependency-audit.py check

      # Generated on every run so a broken generator shows up in the PR that
      # breaks it; uploaded only for main.
      - name: Generate CycloneDX SBOM
        run: python3 scripts/dependency-audit.py sbom --output cinemax-sbom.cdx.json

      - name: Upload SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cinemax-sbom
          path: cinemax-sbom.cdx.json
