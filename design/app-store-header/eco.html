<!doctype html>
<html><head><meta charset="utf-8">
<!-- « Ecosystem » planks: iPhone, iPad, iPhone Duo and Apple TV together, in the canvas
     template of the series. f=ios → the iPhone board (440 × 956, scale 3 → 1320 × 2868);
     f=tv → the Apple TV board (640 × 360, scale 6 → 3840 × 2160).
     Captures (in $ASSETS): tv=, ipad=, iphone=, duo= (a table-mode inner capture). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:#07070A;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.panel{position:relative;overflow:hidden;background:#07070A}
.bloom{position:absolute;inset:0;background:
 radial-gradient(115% 65% at 16% -6%,rgba(76,175,130,.26),rgba(76,175,130,0) 58%),
 radial-gradient(85% 55% at 102% 8%,rgba(91,200,232,.14),rgba(91,200,232,0) 60%),
 radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.65),rgba(0,0,0,0) 55%)}
.grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
 background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .6px);background-size:3px 3px}
.dev{position:absolute;background:#000;overflow:hidden;
 box-shadow:0 2px 0 rgba(255,255,255,.10) inset,0 30px 70px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.12)}
.scr{position:absolute;overflow:hidden;background:#0E0E0E}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.eyebrow{font-weight:700;text-transform:uppercase;color:#4CAF82}
.head{margin:0;font-weight:700;color:#F5F4F1;letter-spacing:-.028em}
.sub{margin:0;color:#8C8C8A;font-weight:400}
.half{position:relative;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 0 0 2px #111}
</style></head>
<body><div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'en', f = q.get('f') || 'ios';
// Headline: the library follows you everywhere (user, 2026-10-08).
const TXT = {
  en: { e: 'iPhone · iPad · iPhone Duo · Apple TV', h: 'Your library,<br>everywhere.', s: 'Pick up where you left off on any of them, or send the film to the big screen with “Play on…”.' },
  fr: { e: 'iPhone · iPad · iPhone Duo · Apple TV', h: 'Votre médiathèque,<br>partout.', s: 'Reprenez où vous en étiez sur chacun, ou envoyez le film sur grand écran avec « Lire sur… ».' },
  de: { e: 'iPhone · iPad · iPhone Duo · Apple TV', h: 'Deine Mediathek,<br>überall.', s: 'Mach auf jedem Gerät da weiter, wo du warst – oder schick den Film mit „Abspielen auf …“ auf den großen Bildschirm.' },
};
const t = TXT[lang];
const dir = q.get('dir');
const img = (k, d) => `<img src="${dir}/${q.get(k) || d}">`;
// A flat device: x, y, w, h, corner radius, bezel, rotation, screen.
const dev = (x, y, w, h, r, b, rot, inner, z = 2) => `
 <div class="dev" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;transform:rotate(${rot}deg);z-index:${z}">
  <div class="scr" style="inset:${b}px;border-radius:${Math.max(r - b, 2)}px">${inner}</div></div>`;
// The half-folded Duo (as in plank.html), width w, at x/y.
const duo = (x, y, w, z = 4) => {
  const ph = Math.round(w * 1426 / 2007), r = w * .08, b = w * .018;
  const src = `${dir}/${q.get('duo') || 'duo-table.png'}`;
  const face = (half) => `position:absolute;inset:${half === 'up' ? `${b}px ${b}px 0` : `0 ${b}px ${b}px`};
    border-radius:${half === 'up' ? `${r - b}px ${r - b}px 0 0` : `0 0 ${r - b}px ${r - b}px`};
    background:#000 url('${src}') 0 ${half === 'up' ? '0' : '100%'} / 100% 200% no-repeat`;
  return `
  <div style="position:absolute;left:${x - w * .08}px;top:${y + ph * 1.4}px;width:${w * 1.16}px;height:${ph * .5}px;border-radius:50%;background:rgba(0,0,0,.9);filter:blur(${w * .06}px);z-index:${z}"></div>
  <div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;perspective:${w * 4.5}px;perspective-origin:50% -20%;z-index:${z}">
   <div style="transform-style:preserve-3d;transform:rotateY(-12deg)">
    <div class="half" style="height:${ph}px;border-radius:${r}px ${r}px 2px 2px;transform-origin:50% 100%;transform:rotateX(-9deg)"><div style="${face('up')}"></div></div>
    <div class="half" style="height:${ph}px;border-radius:2px 2px ${r}px ${r}px;transform-origin:50% 0;transform:rotateX(58deg)">
      <div style="${face('down')}"></div>
      <div style="position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:2px;background:linear-gradient(90deg,#2a2a2d,#8a8a90 30%,#5a5a60 70%,#2a2a2d)"></div></div>
   </div>
  </div>`;
};
let html;
if (f === 'tv') {
  html = `<div class="panel" style="width:640px;height:360px"><div class="bloom"></div>
   <div style="position:absolute;left:36px;top:84px;width:214px;z-index:6">
     <div class="eyebrow" style="font-size:8px;letter-spacing:.2em">${t.e}</div>
     <h2 class="head" style="font-size:23px;line-height:1.06;margin-top:10px">${t.h}</h2>
     <p class="sub" style="font-size:11px;line-height:1.45;margin-top:11px;max-width:210px">${t.s}</p>
   </div>
   ${dev(300, 40, 318, 179, 9, 5, -2, img('tv', 'tv-home-en.png'), 1)}
   <div style="position:absolute;left:428px;top:222px;width:62px;height:4px;border-radius:3px;background:linear-gradient(#2a2a2e,#141416);transform:rotate(-2deg);opacity:.9"></div>
   ${dev(272, 168, 124, 165, 9, 4, -6, img('ipad', 'ipad-home.png'), 3)}
   ${dev(566, 196, 58, 126, 10, 3, 7, img('iphone', 'iphone-home.png'), 3)}
   ${duo(436, 246, 82)}
   <div class="grain"></div></div>`;
} else {
  html = `<div class="panel" style="width:440px;height:956px"><div class="bloom"></div>
   <div style="position:absolute;left:36px;right:36px;top:52px;z-index:6">
     <div class="eyebrow" style="font-size:10.5px;letter-spacing:.2em">${t.e}</div>
     <h2 class="head" style="font-size:40px;line-height:1.02;margin-top:14px">${t.h}</h2>
     <p class="sub" style="font-size:14.5px;line-height:1.42;margin-top:14px;max-width:340px">${t.s}</p>
   </div>
   ${dev(40, 330, 368, 207, 10, 6, -2, img('tv', 'tv-home-en.png'), 1)}
   <div style="position:absolute;left:190px;top:541px;width:72px;height:5px;border-radius:3px;background:linear-gradient(#2a2a2e,#141416);transform:rotate(-2deg);opacity:.9"></div>
   ${dev(22, 560, 178, 237, 13, 6, -5, img('ipad', 'ipad-home.png'), 3)}
   ${dev(318, 600, 104, 226, 18, 4, 6, img('iphone', 'iphone-home.png'), 3)}
   ${duo(166, 692, 148)}
   <div class="grain"></div></div>`;
}
document.getElementById('stage').innerHTML = html;
</script></body></html>
